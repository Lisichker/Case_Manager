<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול עובדות ועדים לבית משפט | Court Case Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="app-body">
  <!-- Top Navigation Bar (Always Visible) -->
  <header id="top-bar" class="top-bar">
    <div class="top-bar-start">
      <div class="app-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">תיק משפטי</span>
          <span class="brand-subtitle">ניהול עובדות וחקירת עדים</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs" role="tablist">
        <button id="tab-btn-table" class="nav-tab active" data-tab="table" role="tab" aria-selected="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>
          </svg>
          <span>טבלת העובדות</span>
        </button>

        <button id="tab-btn-facts" class="nav-tab" data-tab="facts" role="tab" aria-selected="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m9 15 2 2 4-4"/>
          </svg>
          <span>עובדות</span>
        </button>

        <button id="tab-btn-witnesses" class="nav-tab" data-tab="witnesses" role="tab" aria-selected="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>עדים</span>
        </button>
      </nav>
    </div>

    <div class="top-bar-end">
      <!-- Case Room & Share Link Button -->
      <button id="btn-share-case" class="btn btn-secondary btn-sm" title="העתק קישור ישיר לתיק זה לשיתוף עם עורכי דין ועמיתים (ללא צורך בהרשמה)" style="gap: 6px; padding: 5px 10px; font-weight: 700; border-color: var(--border-medium);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <span id="case-name-badge">שתף קישור</span>
      </button>

      <!-- Online Users / Live Sync Status Indicator -->
      <div id="sync-status" class="sync-status" title="חיבור בזמן אמת לשרת">
        <span class="sync-dot" id="sync-indicator-dot"></span>
        <span class="sync-label" id="sync-status-label">1 מחובר</span>
      </div>

      <!-- Lock Switch -->
      <div class="lock-control">
        <label class="lock-switch-label" for="lock-toggle" title="נעילת המערכת מעריכה (מצב קריאה בלבד למניעת שינויים בזמן הדיון)">
          <input type="checkbox" id="lock-toggle" class="lock-checkbox">
          <span class="lock-slider"></span>
          <span class="lock-icon unlock-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
          </span>
          <span class="lock-icon locked-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <span class="lock-text" id="lock-status-text">פתוח לעריכה</span>
        </label>
      </div>

      <!-- Active User Badge Wrapper with Flowing Hover Popover -->
      <div class="user-badge-wrapper" id="user-badge-wrapper">
        <div class="user-badge" id="current-user-badge" title="עורך פעיל (העבר סמן לצפייה בכל העורכים, לחץ לעריכת שמך)">
          <span class="user-avatar-circle" id="user-avatar">ע</span>
          <span class="user-name" id="user-display-name">עו״ד</span>
        </div>

        <!-- Flowing Popover listing current editors (up to 5, otherwise scrollable) -->
        <div class="editors-popover" id="editors-presence-popover">
          <div class="editors-popover-header">
            <div class="popover-header-title">
              <span class="presence-pulse-dot"></span>
              <span>עורכים מחוברים לתיק</span>
            </div>
            <span class="editors-popover-count" id="editors-popover-count">1</span>
          </div>
          <div class="editors-popover-list" id="editors-popover-list">
            <!-- Dynamic editors list rendered by TopBar.js -->
          </div>
          <div class="editors-popover-footer">
            <button type="button" class="btn-popover-rename" id="btn-popover-rename">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>שנה את שמך</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Settings Dropdown Button -->
      <div class="settings-dropdown-wrapper">
        <button id="settings-btn" class="icon-button settings-btn" aria-label="הגדרות" title="הגדרות וקובץ תיק">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <div id="settings-menu" class="settings-menu hidden">
          <div class="menu-header">
            <span class="menu-title">אפשרויות התיק</span>
          </div>
          <button id="menu-save-json" class="menu-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span>שמור תיק כקובץ JSON</span>
          </button>
          <button id="menu-load-json" class="menu-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            <span>טען תיק מקובץ JSON...</span>
          </button>
          <div class="menu-divider"></div>
          <button id="menu-edit-user" class="menu-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>שנה שם עורך</span>
          </button>
          <button id="menu-load-sample" class="menu-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
            <span>טען נתוני דוגמה משפטיים</span>
          </button>
          <div class="menu-divider"></div>
          <button id="menu-clear-case" class="menu-item danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            <span>אפס תיק (נקה הכל)</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Hidden File Input for JSON Loading -->
  <input type="file" id="json-file-input" accept=".json,application/json" class="hidden">

  <!-- Main Content Container -->
  <main id="app-content" class="app-content">
    <!-- Tab 1: Fact Table (טבלת העובדות) -->
    <section id="view-table" class="tab-view active">
      <div id="table-container" class="table-container"></div>
    </section>

    <!-- Tab 2: Facts (עובדות) -->
    <section id="view-facts" class="tab-view hidden">
      <div id="facts-container" class="facts-layout"></div>
    </section>

    <!-- Tab 3: Witnesses (עדים) -->
    <section id="view-witnesses" class="tab-view hidden">
      <div id="witnesses-container" class="witnesses-layout"></div>
    </section>
  </main>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-overlay hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
